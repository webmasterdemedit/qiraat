<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Mes Posts</title>
    <link rel="stylesheet" href="/qiraat/styles.css">
</head>
<body>
    <div class="container">
        <h1>📚 Mes Posts</h1>
        <p class="sous-titre-page">Retrouvez tous vos articles classés par niveau et catégorie</p>
        
        <!-- Filtres -->
        <div class="filters">
            <select id="niveauFilter">
                <option value="">Tous les niveaux</option>
            </select>
            <select id="categorieFilter">
                <option value="">Toutes les catégories</option>
            </select>
            <input type="text" id="searchInput" placeholder="🔍 Rechercher un post...">
        </div>
        
        <!-- Liste des posts -->
        <div id="postsList" class="posts-grid">
            <div class="loader">
                <div class="spinner"></div>
                <p>Chargement des posts...</p>
            </div>
        </div>
    </div>
    
    <script src="/qiraat/script.js"></script>
</body>
</html>
